  title: From surface observations to ocean temperature and mixed-layer variability
  alt: Graphical abstract linking satellite altimetry, sea-surface temperature, wind stress and in situ observations to three-dimensional temperature reconstruction, seasonal mixed-layer depth and decadal variability.
  explanation: Satellite and in situ measurements are combined using multiple linear regression to reconstruct three-dimensional ocean temperature. The reconstructed fields support estimates of seasonal mixed-layer depth and analysis of its decadal variability.
