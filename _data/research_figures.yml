  number: 7
  title: Seasonal mixed-layer depth from reconstructed temperature
  alt: Four global maps show reconstructed mixed-layer depth in winter, spring, summer, and autumn for 1993–2016.
  explanation: Global seasonal mixed-layer-depth climatology for 1993–2016, calculated from reconstructed three-dimensional temperature using a 0.2°C threshold. The maps illustrate how surface measurements can help reveal seasonal changes in upper-ocean structure.
