warming:
  image: https://www.frontiersin.org/files/Articles/825368/xml-images/fmars-09-825368-g008.webp
  number: 8
  title: Winds, circulation, and contrasting temperature changes
  alt: Published schematic of northerly winds, western downwelling and eastern upwelling in the East Sea, with the East Korea Warm Current pathway.
  explanation: This published conceptual schematic connects northerly winds with convergence and downwelling in the western East/Japan Sea and divergence and upwelling in the east. Together with changes in warm-current pathways, these processes help explain the contrasting surface and subsurface temperature changes during 2000–2014.
  credit: Jeong, Nam, Kwon, Uppara & Jo (2022), Frontiers in Marine Science 9, 825368, Figure 8. © The authors.
