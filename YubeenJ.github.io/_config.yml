# GitHub Pages configuration. Profile text is in _data/profile.yml.
title: "Yubeen Jeong | Physical Oceanography"
description: "Yubeen Jeong studies Gulf Stream dynamics and ocean variability through observations."
url: "https://yubeenj.github.io"
baseurl: ""
lang: en
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
collections:
  publications:
    output: false
  manuscripts:
    output: false
defaults:
  - scope:
      path: ""
    values:
      layout: page
exclude:
  - README.md
  - EDITING.md
  - START_HERE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - LICENSES.md
  - VALIDATION.md
